[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.3"]

[project]
name = "cached-historical-data-fetcher"
version = "0.2.31"
description = "Python utility for fetching any historical data using caching."
readme = "README.md"
license = "MIT"
authors = [{ name = "34j" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aiofiles>=23.2.1",
  "joblib>=1.3.2",
  "lz4>=4.3.2",
  "numpy>=1.26.0",
  "pandas>=2.1.1",
  "python-slugify>=8.0.1",
  "tqdm>=4.66.1",
  "typing-extensions>=4.8.0",
]
urls."Bug Tracker" = "https://github.com/34j/cached-historical-data-fetcher/issues"
urls.Changelog = "https://github.com/34j/cached-historical-data-fetcher/blob/main/CHANGELOG.md"
urls.documentation = "https://cached-historical-data-fetcher.readthedocs.io"
urls.repository = "https://github.com/34j/cached-historical-data-fetcher"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "parameterized",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]
notebook = [
  "aiohttp",
  "aiohttp-client-cache[all]",
  "beautifulsoup4",
  "ipykernel",
  "ipywidgets",
  "jupyter",
  "lxml",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
